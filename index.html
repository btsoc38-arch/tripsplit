<script>
"use strict";
// ================= helpers =================
const uid = () => Math.random().toString(36).slice(2, 10);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);
const nowTime = () => { const d=new Date(); return d.toTimeString().slice(0,5); };
const fmtDate = d => {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString(undefined, { day: "numeric", month: "short" });
};
const fmtTime = t => {
  if (!t) return "";
  const dt = new Date("2000-01-01T" + t);
  return isNaN(dt) ? t : dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
};
const fmtDateTime = (d, t) => t ? `${fmtDate(d)} · ${fmtTime(t)}` : fmtDate(d);
// sort key: date + time (time defaults late-blank so dated-only items sort by date alone)
const dtKey = e => (e.date || "") + "T" + (e.time || "00:00");
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const CURRENCIES = {
  AED:"UAE Dirham",AUD:"Australian Dollar",BDT:"Bangladeshi Taka",BHD:"Bahraini Dinar",
  BND:"Brunei Dollar",BRL:"Brazilian Real",CAD:"Canadian Dollar",CHF:"Swiss Franc",

  DKK:"Danish Krone",EGP:"Egyptian Pound",EUR:"Euro",FJD:"Fiji Dollar",
  GBP:"British Pound",HKD:"Hong Kong Dollar",HUF:"Hungarian Forint",IDR:"Indonesian Rupiah",
  ILS:"Israeli Shekel",INR:"Indian Rupee",ISK:"Icelandic Krona",JOD:"Jordanian Dinar",
  JPY:"Japanese Yen",KES:"Kenyan Shilling",KHR:"Cambodian Riel",KRW:"South Korean Won",
  KWD:"Kuwaiti Dinar",LAK:"Lao Kip",LKR:"Sri Lankan Rupee",MAD:"Moroccan Dirham",
  MMK:"Myanmar Kyat",MNT:"Mongolian Tugrik",MOP:"Macanese Pataca",MUR:"Mauritian Rupee",
  MVR:"Maldivian Rufiyaa",MXN:"Mexican Peso",MYR:"Malaysian Ringgit",NOK:"Norwegian Krone",
  NPR:"Nepalese Rupee",NZD:"New Zealand Dollar",OMR:"Omani Rial",PEN:"Peruvian Sol",
  PHP:"Philippine Peso",PKR:"Pakistani Rupee",PLN:"Polish Zloty",QAR:"Qatari Riyal",
  RON:"Romanian Leu",RUB:"Russian Ruble",SAR:"Saudi Riyal",SEK:"Swedish Krona",
  SGD:"Singapore Dollar",THB:"Thai Baht",TRY:"Turkish Lira",TWD:"New Taiwan Dollar",
  TZS:"Tanzanian Shilling",USD:"US Dollar",VND:"Vietnamese Dong",ZAR:"South African Rand",
};
const COUNTRIES = [
  ["Australia","AUD"],["Austria","EUR"],["Bahrain","BHD"],["Bangladesh","BDT"],
  ["Belgium","EUR"],["Brazil","BRL"],["Brunei","BND"],["Cambodia","KHR"],
  ["Canada","CAD"],["Chile","CLP"],["China","CNY"],["Colombia","COP"],
  ["Czech Republic","CZK"],["Denmark","DKK"],["Egypt","EGP"],["Fiji","FJD"],
  ["Finland","EUR"],["France","EUR"],["Germany","EUR"],["Greece","EUR"],
  ["Hong Kong","HKD"],["Hungary","HUF"],["Iceland","ISK"],["India","INR"],
  ["Indonesia","IDR"],["Ireland","EUR"],["Israel","ILS"],["Italy","EUR"],
  ["Japan","JPY"],["Jordan","JOD"],["Kenya","KES"],["Kuwait","KWD"],
  ["Laos","LAK"],["Macau","MOP"],["Malaysia","MYR"],["Maldives","MVR"],
  ["Mauritius","MUR"],["Mexico","MXN"],["Mongolia","MNT"],["Morocco","MAD"],
  ["Myanmar","MMK"],["Nepal","NPR"],["Netherlands","EUR"],["New Zealand","NZD"],
  ["Norway","NOK"],["Oman","OMR"],["Pakistan","PKR"],["Peru","PEN"],
  ["Philippines","PHP"],["Poland","PLN"],["Portugal","EUR"],["Qatar","QAR"],
  ["Romania","RON"],["Russia","RUB"],["Saudi Arabia","SAR"],["Singapore","SGD"],
  ["South Africa","ZAR"],["South Korea","KRW"],["Spain","EUR"],["Sri Lanka","LKR"],
  ["Sweden","SEK"],["Switzerland","CHF"],["Taiwan","TWD"],["Tanzania","TZS"],
  ["Thailand","THB"],["Turkey","TRY"],["United Arab Emirates","AED"],
  ["United Kingdom","GBP"],["United States","USD"],["Vietnam","VND"],
];
const DEFAULT_QUICK = ["SGD","MYR"];
const SPLIT_LABEL = { even:"evenly", percent:"by %", shares:"by portions", exact:"by exact amounts" };

function simplifyDebts(balances){
  const debtors=[],creditors=[];
  Object.entries(balances).forEach(([id,bal])=>{
    const b=r2(bal);
    if(b<-0.005)debtors.push({id,amt:-b});
    else if(b>0.005)creditors.push({id,amt:b});
  });
  debtors.sort((a,b)=>b.amt-a.amt);
  creditors.sort((a,b)=>b.amt-a.amt);
  const transfers=[]; let i=0,j=0;
  while(i<debtors.length&&j<creditors.length){
    const pay=Math.min(debtors[i].amt,creditors[j].amt);
    if(pay>0.005)transfers.push({from:debtors[i].id,to:creditors[j].id,amount:r2(pay)});
    debtors[i].amt=r2(debtors[i].amt-pay);
    creditors[j].amt=r2(creditors[j].amt-pay);
    if(debtors[i].amt<=0.005)i++;
    if(creditors[j].amt<=0.005)j++;
  }
  return transfers;
}

function computeShares(exp){
  const parts=exp.participants,n=parts.length;
  const total=parseFloat(exp.amount)||0;
  const shares={};
  if(n===0||total<=0)return shares;
  if(exp.splitMethod==="even"){
    const base=Math.floor((total/n)*100)/100;
    let rem=r2(total-base*n);
    parts.forEach(pid=>{
      let s=base;
      if(rem>=0.005){s=r2(s+0.01);rem=r2(rem-0.01);}
      shares[pid]=s;
    });
  }else if(exp.splitMethod==="percent"){
    parts.forEach(pid=>{
      const pct=parseFloat(exp.splitValues?.[pid])||0;
      shares[pid]=r2((total*pct)/100);
    });
  }else if(exp.splitMethod==="shares"){
    const ts=parts.reduce((s,pid)=>s+(parseFloat(exp.splitValues?.[pid])||0),0);
    parts.forEach(pid=>{
      const sh=parseFloat(exp.splitValues?.[pid])||0;
      shares[pid]=ts>0?r2((total*sh)/ts):0;
    });
  }else if(exp.splitMethod==="exact"){
    parts.forEach(pid=>{shares[pid]=r2(parseFloat(exp.splitValues?.[pid])||0);});
  }
  return shares;
}

function splitWarning(exp){
  const total=parseFloat(exp.amount)||0;
  if(total<=0||exp.participants.length===0)return null;
  const sum=exp.participants.reduce((s,p)=>s+(parseFloat(exp.splitValues?.[p])||0),0);
  if(exp.splitMethod==="percent"&&Math.abs(sum-100)>0.01)
    return `Percentages add up to ${r2(sum)}%, not 100%`;
  if(exp.splitMethod==="exact"&&Math.abs(sum-total)>0.01)
    return `Amounts add up to ${fmt(sum)}, but the expense is ${fmt(total)}`;
  if(exp.splitMethod==="shares"&&sum<=0)return "Enter at least one portion";
  return null;
}

function compressImage(file,maxDim=1000,quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width,height}=img;
        const scale=Math.min(1,maxDim/Math.max(width,height));
        width=Math.round(width*scale);height=Math.round(height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=width;canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>reject(new Error("bad image"));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("bad file"));
    reader.readAsDataURL(file);
  });
}

// ================= storage: localStorage for data, IndexedDB for photos =================
const LS = {
  getIndex(){ try{const v=localStorage.getItem("ts-index");return v?JSON.parse(v):{trips:[],activeId:null};}catch{return{trips:[],activeId:null};} },
  saveIndex(ix){ try{localStorage.setItem("ts-index",JSON.stringify(ix));}catch(e){toast("Storage full!");} },
  getTrip(id){ try{const v=localStorage.getItem("ts-trip:"+id);return v?JSON.parse(v):null;}catch{return null;} },
  saveTrip(id,d){ try{localStorage.setItem("ts-trip:"+id,JSON.stringify(d));}catch(e){toast("Storage full — couldn't save");} },
  delTrip(id){ localStorage.removeItem("ts-trip:"+id); },
};

let _db=null;
function openDB(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{
    const r=indexedDB.open("tripsplit-photos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("photos");
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return _db;
}
async function photoSet(id,val){
  const d=await openDB();
  return new Promise((res,rej)=>{
    const tx=d.transaction("photos","readwrite");
    tx.objectStore("photos").put(val,id);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  });
}
async function photoGet(id){
  const d=await openDB();
  return new Promise((res,rej)=>{
    const rq=d.transaction("photos").objectStore("photos").get(id);
    rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);
  });
}
async function photoDel(id){
  const d=await openDB();
  return new Promise((res,rej)=>{
    const tx=d.transaction("photos","readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  });
}

// ================= state =================
let S = {
  index: LS.getIndex(),
  trip: null,          // active trip data
  tab: "expenses",
  settleMode: "main",
  renamingId: null,
};
let ED = null;         // expense draft being edited
let C = null;          // last computed balances/transfers
let toastTimer=null;

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div");
  el.className="toast";el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),2400);
}

const activeTrip=()=>S.index.trips.find(t=>t.id===S.index.activeId)||null;
const personName=id=>S.trip?.people.find(p=>p.id===id)?.name||"?";
const rateOf=code=>S.trip?.currencies.find(c=>c.code===code)?.rate??1;
const curLabel=code=>CURRENCIES[code]?`${code} — ${CURRENCIES[code]}`:code;
const saveTrip=()=>{ if(S.index.activeId&&S.trip)LS.saveTrip(S.index.activeId,S.trip); };

function upgradeTrip(d){
  if(!d.destination)d.destination="";
  if(!d.destCurrency)d.destCurrency="";
  if(!d.settlements)d.settlements=[];
  return d;
}

// ================= computations =================
function computeAll(){
  const t=S.trip;
  const bal={},paid={};let total=0;
  t.people.forEach(p=>{bal[p.id]=0;paid[p.id]=0;});
  t.expenses.forEach(exp=>{
    const rate=rateOf(exp.currency);
    const amtBase=(parseFloat(exp.amount)||0)*rate;
    if(!(exp.payer in bal))return;
    total+=amtBase;
    bal[exp.payer]+=amtBase;
    paid[exp.payer]+=amtBase;
    const shares=computeShares(exp);
    Object.entries(shares).forEach(([pid,s])=>{if(pid in bal)bal[pid]-=s*rate;});
  });
  (t.settlements||[]).forEach(st=>{
    const rate=rateOf(st.currency);
    const amt=(parseFloat(st.amount)||0)*rate;
    if(st.from in bal)bal[st.from]+=amt;
    if(st.to in bal)bal[st.to]-=amt;
  });
  const transfers=simplifyDebts(bal);

  const byCur={};
  const ensure=code=>{
    if(!byCur[code]){byCur[code]={balances:{},total:0};t.people.forEach(p=>{byCur[code].balances[p.id]=0;});}
  };
  t.expenses.forEach(exp=>{
    ensure(exp.currency);
    const m=byCur[exp.currency];
    const amt=parseFloat(exp.amount)||0;
    if(!(exp.payer in m.balances))return;
    m.total+=amt;m.balances[exp.payer]+=amt;
    const shares=computeShares(exp);
    Object.entries(shares).forEach(([pid,s])=>{if(pid in m.balances)m.balances[pid]-=s;});
  });
  (t.settlements||[]).forEach(st=>{
    ensure(st.currency);
    const m=byCur[st.currency];
    const amt=parseFloat(st.amount)||0;
    if(st.from in m.balances)m.balances[st.from]+=amt;
    if(st.to in m.balances)m.balances[st.to]-=amt;
  });
  Object.values(byCur).forEach(m=>{m.transfers=simplifyDebts(m.balances);});

  // Settle-in-one-currency view: convert main-currency balances into the chosen settle currency
  const settleCur=(S.settleCurrency&&t.currencies.some(c=>c.code===S.settleCurrency))?S.settleCurrency:t.baseCurrency;
  const f=1/(rateOf(settleCur)||1);
  const balS={},paidS={};
  Object.entries(bal).forEach(([k,v])=>balS[k]=v*f);
  Object.entries(paid).forEach(([k,v])=>paidS[k]=v*f);
  const transfersS=simplifyDebts(balS);

  C={balances:balS,perPersonPaid:paidS,totalSpent:total*f,transfers:transfersS,settleCur,
     balMain:bal,paidMain:paid,totalMain:total,transfersMain:transfers,
     byCurrency:byCur,usedCurrencies:Object.keys(byCur).sort()};
  return C;
}
const sortedExpenses=()=>[...S.trip.expenses].sort((a,b)=>dtKey(b).localeCompare(dtKey(a)));

// ================= render =================
function render(){
  const app=document.getElementById("app");
  if(!S.index.activeId||!S.trip){app.innerHTML=renderHome();return;}
  computeAll();
  const B=S.trip.baseCurrency;
  let body="";
  if(S.tab==="people")body=renderPeople();
  else if(S.tab==="expenses")body=ED?renderEditor():renderExpenses();
  else body=renderSettle();
  app.innerHTML=`
    <button class="back" onclick="goHome()">← All trips</button>
    <h1 class="ts-h1 ts-display">${esc(activeTrip()?.name)}</h1>
    <div class="ts-sub">${S.trip.destination?esc(S.trip.destination)+" · ":""}${S.trip.people.length} people · ${S.trip.expenses.length} expenses · main ${B}</div>
    ${body}
    <nav class="tabbar">
      ${[["people","👥","People"],["expenses","🧾","Expenses"],["settle","🤝","Settle"]].map(([k,ico,lbl])=>
        `<button class="tab${S.tab===k?" on":""}" onclick="setTab('${k}')"><span class="ico">${ico}</span>${lbl}</button>`).join("")}
    </nav>`;
}

function renderHome(){
  const trips=[...S.index.trips].sort((a,b)=>b.createdAt-a.createdAt);
  return `
    <h1 class="ts-h1 ts-display">Trips</h1>
    <div class="ts-sub">Each trip keeps its own people, currencies and expenses</div>
    <div class="card">
      <span class="label">Start a new trip</span>
      <input class="input" id="ntName" placeholder="Trip name (e.g. Taipei July 2026)">

function splitTallyHTML(){
  const m=ED.splitMethod;
  if(m==="even")return "";
  const assigned=ED.participants.reduce((s,p)=>s+(parseFloat(ED.splitValues?.[p])||0),0);
  if(m==="percent"){
    const rem=r2(100-assigned);
    const col=Math.abs(rem)<0.005?"var(--jade)":rem<0?"var(--red)":"var(--amber)";
    const txt=Math.abs(rem)<0.005?"100% assigned ✓":rem<0?`Over by ${fmt(-rem)}%`:`${fmt(rem)}% unassigned`;
    return `<div class="row" style="justify-content:space-between;margin-top:2px;font-size:13px">
      <span style="color:var(--muted)">Assigned ${fmt(assigned)}%</span>
      <span class="ts-mono" style="font-weight:600;color:${col}">${txt}</span></div>`;
  }
  if(m==="exact"){
    const total=parseFloat(ED.amount)||0;
    const rem=r2(total-assigned);
    const col=Math.abs(rem)<0.005?"var(--jade)":rem<0?"var(--red)":"var(--amber)";
    const txt=total<=0?"Enter the amount above":Math.abs(rem)<0.005?"Fully assigned ✓":rem<0?`Over by ${ED.currency} ${fmt(-rem)}`:`${ED.currency} ${fmt(rem)} unassigned`;
    return `<div class="row" style="justify-content:space-between;margin-top:2px;font-size:13px">
      <span style="color:var(--muted)">Assigned ${ED.currency} ${fmt(assigned)}</span>
      <span class="ts-mono" style="font-weight:600;color:${col}">${txt}</span></div>`;
  }
  if(m==="shares"){
    return `<div class="row" style="justify-content:flex-end;margin-top:2px;font-size:13px">
      <span class="ts-mono" style="color:var(--muted)">Total portions: ${fmt(assigned)}</span></div>`;
  }
  return "";
}

function editorPreviewHTML(){

  }
  return html;
}

function renderSettle(){
  const t=S.trip,B=t.baseCurrency;
  const main=S.settleMode==="main";
  const SC=C.settleCur;
  let html=`
    <div class="card">
      <span class="label">Settle in</span>
      <div class="seg">
        <button class="${main?"on":""}" onclick="setSettleMode('main')">One currency</button>
        <button class="${!main?"on":""}" onclick="setSettleMode('byCurrency')">By currency</button>
      </div>
      ${main?`
      <div class="row" style="margin-top:10px">
        <span style="font-size:13px;color:var(--muted);white-space:nowrap">Convert everything to</span>
        <select class="select" style="flex:1" onchange="setSettleCur(this.value)">
          ${t.currencies.map(c=>`<option value="${c.code}"${c.code===SC?" selected":""}>${curLabel(c.code)}${c.code===B?" (main)":c.code===t.destCurrency?" (destination)":""}</option>`).join("")}
        </select>
      </div>`:""}
      <div style="font-size:12px;color:var(--muted);margin-top:8px">
        ${main?`Everything converted to ${SC} using your exchange rates (People tab)`
             :"Each currency settled separately — no conversion, no rates needed"}
      </div>
    </div>`;
  if(main){
    html+=`<div class="card">
      <span class="label">Balances (${SC})</span>
      ${t.people.length===0?`<div class="empty">Add people and expenses first</div>`:""}
      ${t.people.map(p=>{
        const b=r2(C.balances[p.id]||0);
        const col=b>0.005?"var(--jade)":b<-0.005?"var(--red)":"var(--muted)";
        const lbl=b>0.005?"gets back ":b<-0.005?"owes ":"";
        return `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
          <div><div style="font-weight:600">${esc(p.name)}</div>
          <div style="font-size:12px;color:var(--muted)">paid ${SC} ${fmt(C.perPersonPaid[p.id]||0)}</div></div>
          <div class="ts-mono" style="font-weight:600;color:${col}">${lbl}${fmt(Math.abs(b))}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="receipt">
      <div class="ts-display" style="font-weight:700;font-size:16px;text-align:center;letter-spacing:.06em;text-transform:uppercase">Settle up · ${SC}</div>
      <div style="text-align:center;margin-top:4px;margin-bottom:10px"><span class="pill">${C.transfers.length} payment${C.transfers.length===1?"":"s"} outstanding</span></div>
      ${C.transfers.length===0?`<div class="empty" style="padding:14px">All settled — nobody owes anything 🎉</div>`:""}
      ${C.transfers.map((tr,i)=>`
        <div class="rline">
          <span><b>${esc(personName(tr.from))}</b> pays <b>${esc(personName(tr.to))}</b></span>
          <span class="row" style="gap:8px">
            <span class="ts-mono" style="font-weight:600">${SC} ${fmt(tr.amount)}</span>
            <button class="btn btn-settle" onclick="markSettledUI('main','',${i})">Settle ✓</button>
          </span>
        </div>`).join("")}
      <div class="rline" style="margin-top:6px;color:var(--muted);font-size:12px">
        <span>Total trip spend</span><span class="ts-mono">${SC} ${fmt(C.totalSpent)}</span>
      </div>
    </div>`;
  }else{
    if(C.usedCurrencies.length===0)html+=`<div class="card"><div class="empty">No expenses yet</div></div>`;
    C.usedCurrencies.forEach(code=>{
      const m=C.byCurrency[code];
      if(m.total===0&&m.transfers.length===0)return;
      html+=`<div class="receipt">
        <div class="ts-display" style="font-weight:700;font-size:16px;text-align:center;letter-spacing:.06em;text-transform:uppercase">Settle up · ${code}</div>
        <div style="text-align:center;margin-top:4px;margin-bottom:10px"><span class="pill">${m.transfers.length} payment${m.transfers.length===1?"":"s"} outstanding</span></div>
        ${m.transfers.length===0?`<div class="empty" style="padding:14px">All settled in ${code}</div>`:""}
        ${m.transfers.map((tr,i)=>`
          <div class="rline">
            <span><b>${esc(personName(tr.from))}</b> pays <b>${esc(personName(tr.to))}</b></span>
            <span class="row" style="gap:8px">
              <span class="ts-mono" style="font-weight:600">${code} ${fmt(tr.amount)}</span>
              <button class="btn btn-settle" onclick="markSettledUI('byCurrency','${code}',${i})">Settle ✓</button>
            </span>
          </div>`).join("")}
        <div class="rline" style="margin-top:6px;color:var(--muted);font-size:12px">
          <span>Total spent in ${code}</span><span class="ts-mono">${fmt(m.total)}</span>
        </div>
      </div>`;
    });
  }
  if((t.settlements||[]).length>0){
    html+=`<div class="card">
      <span class="label">Settlement history</span>
      ${[...t.settlements].reverse().map(st=>`
        <div class="hist-item">
          <span><span class="ts-mono" style="color:var(--muted);margin-right:6px">${fmtDate(st.date)}</span>
          <b>${esc(personName(st.from))}</b> paid <b>${esc(personName(st.to))}</b></span>
          <span class="row" style="gap:6px">
            <span class="ts-mono" style="font-weight:600">${st.currency} ${fmt(st.amount)}</span>
            <button class="btn btn-danger" style="padding:4px" onclick="undoSettlementUI('${st.id}')">Undo</button>
          </span>
        </div>`).join("")}
    </div>`;
  }
  html+=`<div class="row" style="margin-top:18px">
    <button class="btn btn-primary" style="flex:1;padding:13px" onclick="copySummaryUI()">Copy summary</button>
    <button class="btn btn-ghost" style="flex:1;padding:13px" onclick="exportExcelUI()">⬇ Export Excel</button>
  </div>`;
  return html;
}

// ================= actions =================
window.goHome=()=>{S.index.activeId=null;S.trip=null;ED=null;LS.saveIndex(S.index);render();};
window.goTrip=id=>{
  S.index.activeId=id;LS.saveIndex(S.index);
  S.trip=upgradeTrip(LS.getTrip(id)||{baseCurrency:"SGD",destination:"",destCurrency:"",currencies:[{code:"SGD",rate:1}],people:[],expenses:[],settlements:[]});
  S.tab="expenses";S.settleMode="main";S.settleCurrency=S.trip.baseCurrency;ED=null;render();
};
window.setTab=t=>{S.tab=t;ED=null;render();};
window.setSettleMode=m=>{S.settleMode=m;render();};
window.setSettleCur=code=>{S.settleCurrency=code;render();};

window.createTripUI=()=>{
  const name=document.getElementById("ntName").value.trim();
  if(!name){toast("Give the trip a name first");return;}
  const dest=document.getElementById("ntDest").value;
  const main=document.getElementById("ntMain").value;
  const destCur=COUNTRIES.find(([c])=>c===dest)?.[1]||"";
  const codes=[...new Set([main,...DEFAULT_QUICK,destCur].filter(Boolean))];
  const id=uid();
  const data={baseCurrency:main,destination:dest,destCurrency:destCur,
    currencies:codes.map(code=>({code,rate:1})),people:[],expenses:[],settlements:[]};
  LS.saveTrip(id,data);
  S.index.trips.push({id,name,createdAt:Date.now()});
  window.goTrip(id);
};
window.renameStart=id=>{S.renamingId=id;render();};
window.renameSave=id=>{
  const v=document.getElementById("rn-"+id).value.trim();
  if(v){const t=S.index.trips.find(x=>x.id===id);if(t)t.name=v;LS.saveIndex(S.index);}
  S.renamingId=null;render();
};
window.deleteTripUI=async id=>{
  if(!await confirmDialog("Delete this trip and all its expenses? This can't be undone."))return;
  const data=LS.getTrip(id);
  if(data)for(const e of data.expenses||[])if(e.hasPhoto){try{await photoDel(e.id);}catch{}}
  LS.delTrip(id);
  S.index.trips=S.index.trips.filter(t=>t.id!==id);
  if(S.index.activeId===id){S.index.activeId=null;S.trip=null;}
  LS.saveIndex(S.index);toast("Trip deleted");render();
};

window.addPersonUI=()=>{
  const el=document.getElementById("pName");
  const n=el.value.trim();if(!n)return;
  S.trip.people.push({id:uid(),name:n});saveTrip();render();
};
window.removePersonUI=id=>{
  const used=S.trip.expenses.some(e=>e.payer===id||e.participants.includes(id))||
    (S.trip.settlements||[]).some(st=>st.from===id||st.to===id);
  if(used){toast("Remove their expenses/settlements first");return;}
  S.trip.people=S.trip.people.filter(p=>p.id!==id);saveTrip();render();
};

window.setMainCurUI=code=>{
  if(!S.trip.currencies.some(c=>c.code===code))S.trip.currencies.push({code,rate:1});
  S.trip.currencies=S.trip.currencies.map(c=>c.code===code?{...c,rate:1}:c);
  S.trip.baseCurrency=code;saveTrip();render();
};
window.setRateUI=(code,val)=>{
  const c=S.trip.currencies.find(c=>c.code===code);
  if(c)c.rate=parseFloat(val)||0;saveTrip();
};
window.addCurrencyUI=()=>{
  const code=document.getElementById("curPick").value;
  if(!code)return;
  if(S.trip.currencies.some(c=>c.code===code)){toast("Already added");return;}
  S.trip.currencies.push({code,rate:1});saveTrip();render();
};
window.removeCurrencyUI=code=>{
  if(code===S.trip.baseCurrency){toast("Can't remove the main currency");return;}
  if(S.trip.expenses.some(e=>e.currency===code)||(S.trip.settlements||[]).some(st=>st.currency===code)){
    toast("Expenses or settlements use this currency");return;
  }
  S.trip.currencies=S.trip.currencies.filter(c=>c.code!==code);saveTrip();render();
};

window.newExpenseUI=()=>{
  if(S.trip.people.length<2){toast("Add at least two people first (People tab)");return;}
  ED={id:uid(),desc:"",amount:"",currency:S.trip.destCurrency||S.trip.baseCurrency,
    payer:S.trip.people[0]?.id||"",participants:S.trip.people.map(p=>p.id),
    splitMethod:"even",splitValues:{},hasPhoto:false,date:today(),time:nowTime(),
    _photo:null,_photoRemoved:false,_isNew:true};
  render();
};
window.openExpenseUI=async id=>{
  const e=S.trip.expenses.find(x=>x.id===id);if(!e)return;
  ED={...e,splitValues:{...e.splitValues},date:e.date||today(),time:e.time||"",_photo:null,_photoRemoved:false};
  if(e.hasPhoto){try{ED._photo=await photoGet(e.id);}catch{}}
  render();
};
window.cancelExpenseUI=()=>{ED=null;render();};
window.setEDCur=code=>{ED.currency=code;render();};
window.setEDPayer=id=>{ED.payer=id;render();};
window.toggleEDPart=id=>{
  ED.participants=ED.participants.includes(id)
    ?ED.participants.filter(x=>x!==id):[...ED.participants,id];
  render();
};
window.setEDSplit=m=>{ED.splitMethod=m;render();};
window.updatePreview=()=>{
  const el=document.getElementById("edPreview");
  if(el)el.innerHTML=editorPreviewHTML();
  const tl=document.getElementById("edTally");
  if(tl)tl.innerHTML=splitTallyHTML();
};
window.distributeRemaining=()=>{
  const parts=ED.participants;
  if(parts.length===0)return;
  if(ED.splitMethod==="percent"){
    const blanks=parts.filter(p=>!(ED.splitValues?.[p]>0)&&(ED.splitValues?.[p]!==0));
    const assigned=parts.reduce((s,p)=>s+(parseFloat(ED.splitValues?.[p])||0),0);
    const targets=blanks.length>0?blanks:parts;
    const rem=blanks.length>0?100-assigned:100;
    if(blanks.length===0)parts.forEach(p=>ED.splitValues[p]="");
    const each=Math.floor((rem/targets.length)*100)/100;
    let leftover=r2(rem-each*targets.length);
    targets.forEach(p=>{let v=each;if(leftover>=0.005){v=r2(v+0.01);leftover=r2(leftover-0.01);}ED.splitValues[p]=v>0?String(v):"0";});
  }else if(ED.splitMethod==="exact"){
    const total=parseFloat(ED.amount)||0;
    if(total<=0){toast("Enter the total amount first");return;}
    const blanks=parts.filter(p=>!(ED.splitValues?.[p]>0)&&(ED.splitValues?.[p]!==0));
    const assigned=parts.reduce((s,p)=>s+(parseFloat(ED.splitValues?.[p])||0),0);
    const targets=blanks.length>0?blanks:parts;
    const rem=blanks.length>0?r2(total-assigned):total;
    if(rem<0){toast("Already over the total");return;}
    if(blanks.length===0)parts.forEach(p=>ED.splitValues[p]="");
    const each=Math.floor((rem/targets.length)*100)/100;
    let leftover=r2(rem-each*targets.length);
    targets.forEach(p=>{let v=each;if(leftover>=0.005){v=r2(v+0.01);leftover=r2(leftover-0.01);}ED.splitValues[p]=String(v);});
  }
  render();
};
window.pickPhoto=()=>document.getElementById("photoInput").click();
document.getElementById("photoInput").addEventListener("change",async ev=>{
  const file=ev.target.files?.[0];ev.target.value="";
  if(!file||!ED)return;
  try{
    const dataUrl=await compressImage(file);
    ED._photo=dataUrl;ED._photoRemoved=false;render();
  }catch(e){toast("Couldn't read that image");}
});
window.removePhotoUI=()=>{ED._photo=null;ED._photoRemoved=true;render();};

window.saveExpenseUI=async()=>{
  if(!ED.desc.trim()||!(parseFloat(ED.amount)>0)||!ED.payer||ED.participants.length===0){
    toast("Fill in description, amount, payer and participants");return;
  }
  let hasPhoto=ED.hasPhoto;
  try{
    if(ED._photo){await photoSet(ED.id,ED._photo);hasPhoto=true;}
    else if(ED._photoRemoved&&ED.hasPhoto){try{await photoDel(ED.id);}catch{}hasPhoto=false;}
  }catch(e){toast("Photo couldn't be saved, but the expense was");}
  const clean={...ED,hasPhoto};
  delete clean._photo;delete clean._photoRemoved;delete clean._isNew;
  const i=S.trip.expenses.findIndex(x=>x.id===clean.id);
  if(i>=0)S.trip.expenses[i]=clean;else S.trip.expenses.push(clean);
  ED=null;saveTrip();render();
};
window.delExpenseUI=async id=>{
  const e=S.trip.expenses.find(x=>x.id===id);
  if(e?.hasPhoto){try{await photoDel(id);}catch{}}
  S.trip.expenses=S.trip.expenses.filter(x=>x.id!==id);saveTrip();render();
};
window.viewPhotoUI=async id=>{
  try{
    const p=await photoGet(id);
    if(p)showPhotoModal(p);else toast("Photo not found");
  }catch{toast("Photo not found");}
};
window.showPhotoModal=src=>{
  const m=document.createElement("div");
  m.className="photo-modal";
  m.innerHTML=`<img src="${src}"><button class="btn" style="margin-top:14px;background:#fff;color:var(--ink)">Close</button>`;
  m.onclick=()=>m.remove();
  document.body.appendChild(m);
};

// In-app confirmation dialog (browser confirm() is blocked in some sandboxed environments)
function confirmDialog(msg){
  return new Promise(res=>{
    const m=document.createElement("div");
    m.className="photo-modal";
    m.innerHTML=`<div style="background:#fff;border-radius:14px;padding:20px;max-width:320px;width:100%;text-align:center">
      <div style="font-size:15px;line-height:1.45;margin-bottom:16px;color:var(--ink)">${esc(msg)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary" data-cf="yes" style="flex:1">Confirm</button>
        <button class="btn btn-ghost" data-cf="no" style="flex:1">Cancel</button>
      </div></div>`;
    m.querySelector('[data-cf="yes"]').onclick=ev=>{ev.stopPropagation();m.remove();res(true);};
    m.querySelector('[data-cf="no"]').onclick=ev=>{ev.stopPropagation();m.remove();res(false);};
    document.body.appendChild(m);
  });
}

window.markSettledUI=async(mode,code,i)=>{
  const tr=mode==="main"?C.transfers[i]:C.byCurrency[code]?.transfers[i];
  if(!tr)return;
  const cur=mode==="main"?C.settleCur:code;
  if(!await confirmDialog(`${personName(tr.from)} has paid ${personName(tr.to)} ${cur} ${fmt(tr.amount)}?`))return;
  S.trip.settlements.push({id:uid(),from:tr.from,to:tr.to,amount:tr.amount,currency:cur,date:today()});
  saveTrip();toast("Settlement recorded ✓");render();
};
window.undoSettlementUI=async id=>{
  if(!await confirmDialog("Undo this settlement? The debt will reappear."))return;
  S.trip.settlements=S.trip.settlements.filter(x=>x.id!==id);saveTrip();render();
};

function buildSummary(){
  const t=S.trip,B=t.baseCurrency;
  let out=`${activeTrip()?.name||"Trip"} — Expense Summary\n`;
  if(t.destination)out+=`Destination: ${t.destination}\n`;
  out+=`\n— Expenses —\n`;
  sortedExpenses().forEach(e=>{
    const dt=e.date?(e.date+(e.time?" "+e.time:"")+" "):"";
    out+=`• ${dt}${e.desc}: ${e.currency} ${fmt(parseFloat(e.amount)||0)} (paid by ${personName(e.payer)})\n`;
  });
  if((t.settlements||[]).length>0){
    out+=`\n— Settlements made —\n`;
    t.settlements.forEach(st=>{out+=`✓ ${st.date}: ${personName(st.from)} paid ${personName(st.to)} ${st.currency} ${fmt(st.amount)}\n`;});
  }
  if(S.settleMode==="main"){
    const SC=C.settleCur;
    out+=`\nTotal spent: ${SC} ${fmt(C.totalSpent)}\n\n— Outstanding (${SC}) —\n`;
    if(C.transfers.length===0)out+="All settled!\n";
    C.transfers.forEach(tr=>{out+=`${personName(tr.from)} pays ${personName(tr.to)} ${SC} ${fmt(tr.amount)}\n`;});
  }else{
    out+=`\n— Outstanding by currency —\n`;
    let any=false;
    C.usedCurrencies.forEach(code=>{
      C.byCurrency[code].transfers.forEach(tr=>{
        any=true;out+=`${personName(tr.from)} pays ${personName(tr.to)} ${code} ${fmt(tr.amount)}\n`;
      });
    });
    if(!any)out+="All settled!\n";
  }
  return out;
}
window.copySummaryUI=async()=>{
  const text=buildSummary();
  try{await navigator.clipboard.writeText(text);toast("Summary copied — paste it anywhere");}
  catch{
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");ta.remove();
    toast("Summary copied — paste it anywhere");
  }
};

window.exportExcelUI=()=>{
  if(typeof XLSX==="undefined"){toast("Excel library not loaded — check your connection");return;}
  try{
    const t=S.trip,B=t.baseCurrency;
    const wb=XLSX.utils.book_new();
    const exps=sortedExpenses();
    const expRows=exps.map(e=>({
      Date:e.date||"",Time:e.time||"",Description:e.desc,Currency:e.currency,
      Amount:r2(parseFloat(e.amount)||0),
      ["Amount ("+B+")"]:r2((parseFloat(e.amount)||0)*rateOf(e.currency)),
      "Paid by":personName(e.payer),
      "Split method":SPLIT_LABEL[e.splitMethod]||e.splitMethod,
      Participants:e.participants.map(personName).join(", "),
      "Has receipt photo":e.hasPhoto?"Yes":"No",
    }));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(expRows.length?expRows:[{Description:"No expenses"}]),"Expenses");
    const shareRows=exps.map(e=>{
      const sh=computeShares(e);
      const row={Date:e.date||"",Time:e.time||"",Description:e.desc,Currency:e.currency};
      t.people.forEach(p=>{row[p.name]=r2(sh[p.id]||0);});
      return row;
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(shareRows.length?shareRows:[{Description:"No expenses"}]),"Shares per person");
    const balRows=t.people.map(p=>({
      Person:p.name,
      ["Paid ("+B+")"]:r2(C.paidMain[p.id]||0),
      ["Net balance ("+B+")"]:r2(C.balMain[p.id]||0),
      Status:r2(C.balMain[p.id]||0)>0.005?"Gets back":r2(C.balMain[p.id]||0)<-0.005?"Owes":"Settled",
    }));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(balRows.length?balRows:[{Person:"No people"}]),"Balances");
    const outRows=[];
    C.transfersMain.forEach(tr=>outRows.push({Mode:"Main ("+B+")",From:personName(tr.from),To:personName(tr.to),Currency:B,Amount:tr.amount}));
    C.usedCurrencies.forEach(code=>{
      C.byCurrency[code].transfers.forEach(tr=>outRows.push({Mode:"By currency",From:personName(tr.from),To:personName(tr.to),Currency:code,Amount:tr.amount}));
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(outRows.length?outRows:[{Mode:"All settled"}]),"Outstanding");
    const histRows=(t.settlements||[]).map(st=>({Date:st.date,From:personName(st.from),To:personName(st.to),Currency:st.currency,Amount:st.amount}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(histRows.length?histRows:[{From:"No settlements yet"}]),"Settlement history");
    const rateRows=t.currencies.map(c=>({Currency:c.code,Name:CURRENCIES[c.code]||"",["Rate (1 unit in "+B+")"]:c.code===B?1:c.rate}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rateRows),"Exchange rates");
    const safeName=(activeTrip()?.name||"trip").replace(/[\\/:*?"<>|]/g,"-");
    XLSX.writeFile(wb,safeName+" - expenses.xlsx");
    toast("Excel file downloaded");
  }catch(e){console.error(e);toast("Export failed — try again");}
};

// ================= boot =================
if(S.index.activeId){
  const d=LS.getTrip(S.index.activeId);
  if(d)S.trip=upgradeTrip(d);else S.index.activeId=null;
}
render();
</script>
